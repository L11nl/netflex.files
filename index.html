<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="color-scheme" content="dark light" />
  <title>إدارة الإيميلات والبروفايلات</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="splash" class="splash" aria-live="polite">
    <div class="splash-logo" aria-hidden="true">
      <span></span><span></span><i></i>
    </div>
    <strong>إدارة الملفات الشخصية</strong>
    <small>جاري تحميل بياناتك المحلية...</small>
  </div>

  <div id="lockScreen" class="lock-screen hidden" aria-hidden="true">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h1>الموقع مقفل</h1>
      <p>أدخل رمز PIN للمتابعة</p>
      <input id="unlockPin" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••" />
      <button id="unlockBtn" class="btn primary wide">فتح الموقع</button>
      <p id="unlockError" class="form-error"></p>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <div>
        <h1>إدارة الملفات الشخصية</h1>
        <p>إدارة الإيميلات والبروفايلات من مكان واحد</p>
      </div>
      <button class="icon-btn" data-action="go-settings" aria-label="الإعدادات" title="الإعدادات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.55V20.3h-3v-.09a1.7 1.7 0 0 0-1.04-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.55-1.04H5.3v-3h.15A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06A1.7 1.7 0 0 0 10.66 6a1.7 1.7 0 0 0 1.04-1.55V4.3h3v.15A1.7 1.7 0 0 0 15.74 6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.04h.15v3h-.15A1.7 1.7 0 0 0 19.4 15Z"/></svg>
      </button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>الرئيسية</small></button>
      <button data-view="sold-emails" class="nav-item"><span>✉</span><small>الإيميلات المباعة</small></button>
      <button data-view="settings" class="nav-item"><span>⚙</span><small>الإعدادات</small></button>
    </nav>

    <footer class="footer-note">خدمة البريد الإلكتروني مقدمة بواسطة <strong>Generator.email</strong></footer>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
  <section id="bottomSheet" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-label="نافذة التفاصيل">
    <div class="sheet-handle"></div>
    <div id="sheetContent" class="sheet-content"></div>
  </section>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <section id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div id="modalContent"></div>
  </section>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <input id="backupImportInput" type="file" accept="application/json,.json" hidden />
  <input id="profileImageInput" type="file" accept="image/*" hidden />

  <script src="app.js?v=20260808-mailbox-read-v5" defer></script>
</body>
</html>
